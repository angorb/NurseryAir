; Generic ESP32 target works for the Thing Plus C (ESP32-WROOM-32E).
; If your PlatformIO version lists a SparkFun Thing Plus C board, you can swap it in.
[env:thingplusc]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    adafruit/Adafruit BME680 Library@^2.0.4
    adafruit/Adafruit BusIO@^1.16.1
    adafruit/Adafruit Unified Sensor@^1.1.14
